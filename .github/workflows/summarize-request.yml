name: Summarize an appeals case

# Two ways to request an AI summary for one appeals case:
#  1. Open an issue titled "Summarize <court> <docket>", e.g. "Summarize ca4 25-2342".
#     The calendar page's "Request AI summary" link pre-fills this. Only issues opened by the
#     repo owner are acted on, so nobody else can spend your API credits.
#  2. Actions tab → "Summarize an appeals case" → Run workflow, and type the court and docket.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      court:
        description: "Court id: ca1–ca11, cadc or cafc"
        required: true
      docket:
        description: "Docket number, e.g. 25-2342"
        required: true
      title:
        description: "Case name (only needed if the case isn't on a calendar the site reads)"
        required: false

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: update-court-data      # same group as the daily update, so they never push at the same time
  cancel-in-progress: false

jobs:
  summarize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.author_association == 'OWNER' && startsWith(github.event.issue.title, 'Summarize '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r _oral_arguments/requirements.txt

      - name: Work out which case
        id: req
        env:                                  # passed as data, never pasted into the script
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_COURT: ${{ inputs.court }}
          IN_DOCKET: ${{ inputs.docket }}
          IN_TITLE: ${{ inputs.title }}
        run: |
          python - <<'PY'
          import os, re
          court, docket, title = os.environ.get("IN_COURT", ""), os.environ.get("IN_DOCKET", ""), os.environ.get("IN_TITLE", "")
          m = re.match(r"\s*Summarize\s+(ca\d{1,2}|cadc|cafc)\s+(\d{2}-\d{1,5})\b", os.environ.get("ISSUE_TITLE", ""), re.I)
          if m:
              court, docket = m.group(1), m.group(2)
              t = re.search(r"^Case name:\s*(.+)$", os.environ.get("ISSUE_BODY") or "", re.M)
              title = t.group(1).strip() if t else ""
          ok = bool(re.fullmatch(r"(ca\d{1,2}|cadc|cafc)", court.lower().strip()) and re.fullmatch(r"\d{2}-\d{1,5}", docket.strip()))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
              f.write(f"court={court.lower().strip()}\ndocket={docket.strip()}\n")
              f.write(f"title={title.replace(chr(10), ' ')[:200]}\n")
          PY

      - name: Add to the list and summarize
        if: steps.req.outputs.ok == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURT: ${{ steps.req.outputs.court }}
          DOCKET: ${{ steps.req.outputs.docket }}
          CASE_TITLE: ${{ steps.req.outputs.title }}
        run: |
          if [ -n "$CASE_TITLE" ]; then
            python _oral_arguments/scripts/summarize_selected.py --add "$COURT" "$DOCKET" --title "$CASE_TITLE"
          else
            python _oral_arguments/scripts/summarize_selected.py --add "$COURT" "$DOCKET"
          fi

      - name: Commit and push
        id: commit
        if: steps.req.outputs.ok == 'true'
        env:
          COURT: ${{ steps.req.outputs.court }}
          DOCKET: ${{ steps.req.outputs.docket }}
        run: |
          git config user.name  "court-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _oral_arguments/selected_cases.json courts/oral-arguments/data/circuit_briefs.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "AI summary for $COURT $DOCKET"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Reply on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.req.outputs.ok }}
          RESULT: ${{ job.status }}
          COURT: ${{ steps.req.outputs.court }}
          DOCKET: ${{ steps.req.outputs.docket }}
        run: |
          if [ "$OK" != "true" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "Couldn't read a court and docket from the title. Use the form \`Summarize ca4 25-2342\`."
          elif [ "$RESULT" = "success" ] && grep -q "\"$COURT:$DOCKET\"" courts/oral-arguments/data/circuit_briefs.json; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "Added $COURT $DOCKET and wrote its AI summary. It will show on the calendar after the site rebuilds (a minute or two)."
            gh issue close "$NUM" --repo "${{ github.repository }}"
          else
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "Added $COURT $DOCKET to the list, but no summary was written yet. Check the run log (Actions tab): the API key may be missing, or the case may not be on a calendar the site reads (then add a line \`Case name: …\` to a new request). The daily update will retry."
          fi
